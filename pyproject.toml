[project]
name = "seq-thunderstorm-tracker"
version = "0.6.0"
description = "Home Assistant integration for the BoM Thunderstorm Tracker (SEQ pilot). The code lives in custom_components/."
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "pillow"]

[tool.pytest.ini_options]
testpaths = ["test/python"]
pythonpath = [".", "test/python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
